[project]
name = "accountability-bot"
version = "0.1.0"
description = "Telegram accountability bot for daily 3-goal check-ins"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "apscheduler==3.11.0",
  "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
