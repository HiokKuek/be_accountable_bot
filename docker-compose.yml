services:
  accountability-bot:
    build: .
    container_name: accountability-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8788:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
